[project]
name = "ai-powered-app-backend"
version = "0.1.0"
description = "FastAPI backend for the Reapit One-Platform demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "tavily-python>=0.5",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]

# Bedrock is the retired AWS provider path, kept as reference behind
# LLM_PROVIDER=bedrock. boto3 is only imported on that path, so it is an
# extra rather than a runtime dependency: `uv sync --extra bedrock`.
[project.optional-dependencies]
bedrock = ["boto3>=1.34"]

[dependency-groups]
# The Dockerfile syncs with --no-dev, so everything here stays out of the
# runtime image. pyarrow (83 MB) is needed only by the two build scripts
# that WRITE parquet; the app reads parquet through DuckDB, which is a
# runtime dependency anyway. boto3 is here because test_bedrock_chat.py
# patches the boto3 client, which needs the module importable.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pyarrow>=16.0",
    "boto3>=1.34",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
