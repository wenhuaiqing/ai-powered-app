name: Warm

# On-demand warm-up for the demo: run this from the Actions tab (or your
# phone) ~90 s before a screen-share and the app is hot for the next 30
# minutes. It waits through a cold start (the platform holds the request),
# then reports the time-to-200 in the step summary.
#
# The SCHEDULED warm windows (10:00-11:30 and 14:00-15:00 AEST, weekdays)
# are Azure Container Apps cron Jobs in infra-azure/warm.tf, not GitHub
# schedules: GitHub's cron is best-effort and on 11/09/2026 fired zero of
# four morning pings. Execution history:
#   az containerapp job execution list -n job-warm-am -g rg-aipapp -o table

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping /health (a cold start is held by the platform, ~30 s)
        run: |
          url="https://app.blackwave-53cf4f76.australiaeast.azurecontainerapps.io/health"
          start=$(date +%s)
          code="000"
          for attempt in 1 2 3; do
            # curl prints 000 itself when the connection fails; '|| true' keeps
            # the loop alive without appending a second 000 to it.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 240 "$url" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          took=$(( $(date +%s) - start ))
          echo "HTTP $code after ${took}s (attempt $attempt)"
          {
            echo "| When (UTC) | Result | Time to 200 | Attempts |"
            echo "|---|---|---|---|"
            echo "| $(date -u +'%Y-%m-%d %H:%M') | HTTP $code | ${took}s | $attempt |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ]
