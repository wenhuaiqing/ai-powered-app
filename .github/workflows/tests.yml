name: Tests

# Tier 1: the unit suite. Deliberately hermetic -- no API keys, no
# MySQL, no network. The two agent-node tests read the DuckDB analytics
# database, so build_db.py runs first (the DuckDB-only path, no MySQL);
# nothing here needs the trained model or the RAG parquets.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend deps
        working-directory: backend
        run: uv sync

      - name: Build DuckDB
        working-directory: backend
        run: uv run python ../scripts/build_db.py

      - name: Run unit tests
        working-directory: backend
        run: uv run pytest -q
