# Build + push both images to GHCR, then roll the Azure Container Apps.
#
# Auth story matches the AWS pipeline it replaces: NO static cloud
# credentials -- azure/login exchanges the Actions OIDC token against a
# user-assigned managed identity (workload identity federation, see
# infra-azure/cicd.tf). GHCR pushes use the built-in GITHUB_TOKEN.
#
# Requires repo secrets (from `terraform -chdir=infra-azure output`):
#   AZURE_CLIENT_ID        gha identity client id
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID

name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # OIDC token for azure/login

env:
  RESOURCE_GROUP: rg-aipapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names (lowercase, sha-pinned)
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=ghcr.io/${REPO_LC}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${REPO_LC}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=ghcr.io/${REPO_LC}/backend:latest" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=ghcr.io/${REPO_LC}/frontend:latest" >> "$GITHUB_OUTPUT"

      - name: Build + push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
            ${{ steps.meta.outputs.backend_latest }}

      - name: Build + push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
            ${{ steps.meta.outputs.frontend_latest }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC, no static keys)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll both containers (one app, sidecar layout)
        run: |
          az containerapp update \
            --name app \
            --resource-group "$RESOURCE_GROUP" \
            --container-name backend \
            --image "${{ needs.build-and-push.outputs.backend_image }}"
          az containerapp update \
            --name app \
            --resource-group "$RESOURCE_GROUP" \
            --container-name frontend \
            --image "${{ needs.build-and-push.outputs.frontend_image }}"

      - name: Print demo URL
        run: |
          az containerapp show --name app --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv
